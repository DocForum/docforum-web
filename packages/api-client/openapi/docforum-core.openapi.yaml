# OpenAPI contract fixture for docforum-core's HTTP API.
#
# This file is the *only* hand-maintained description of the backend
# contract in this repo. `@docforum/api-client` generates its TypeScript
# types from it (`npm run generate:api`), and every call in
# `src/services/` is typed against those generated types — so a change
# here that doesn't match the frontend becomes a compile error instead of
# a runtime surprise.
#
# Source of truth: docforum-core's own spec (docforum-core#113). Until
# that issue publishes `openapi.json` + the `@docforum/api-client`
# release tarball, this vendored fixture stands in for it: it documents
# the endpoints/shapes this repo actually calls, and
# `scripts/check-api-client-version.mjs` compares our version against the
# live backend's spec (warn-only for now). When docforum-core#113 lands,
# swap the dependency in package.json for the published tarball and keep
# this file as the local fixture used by tests.
openapi: 3.0.3
info:
  title: docforum-core API
  description: Endpoints consumed by docforum-web. Contract fixture (see header).
  version: 0.1.0
servers:
  - url: http://localhost:4000
  - url: https://docforum-core-api.onrender.com
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: account
  - name: dependents
  - name: health
  - name: care-threads
  - name: facilities
  - name: facility-team
  - name: queue
  - name: messaging
  - name: consultation
  - name: insights
  - name: payments

paths:
  /auth/signup:
    post:
      tags: [auth]
      operationId: signup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupInput' }
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      responses:
        '204': { description: Session revoked }

  /auth/claim-account:
    post:
      tags: [auth]
      operationId: claimAccount
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimAccountInput' }
      responses:
        '204': { description: Guardian link claimed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '410': { $ref: '#/components/responses/Gone' }

  /account/data-export:
    get:
      tags: [account]
      operationId: getDataExportStatus
      responses:
        '200':
          description: Latest export, or null when none exists
          content:
            application/json:
              schema:
                type: object
                nullable: true
                allOf:
                  - $ref: '#/components/schemas/DataExport'
    post:
      tags: [account]
      operationId: requestDataExport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestDataExportInput' }
      responses:
        '202':
          description: Export queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataExport' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /account/data-export/{exportId}/download:
    get:
      tags: [account]
      operationId: downloadDataExport
      parameters:
        - $ref: '#/components/parameters/ExportId'
      responses:
        '200':
          description: Export archive
          content:
            application/json:
              schema:
                type: string
                format: binary
        '404': { $ref: '#/components/responses/NotFound' }

  /account/delete:
    post:
      tags: [account]
      operationId: deleteAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteAccountInput' }
      responses:
        '200':
          description: Account deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteAccountResponse' }
        '409': { $ref: '#/components/responses/Conflict' }

  /patients/me/dependents:
    get:
      tags: [dependents]
      operationId: listDependents
      responses:
        '200':
          description: Dependents of the signed-in guardian
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Dependent' }
    post:
      tags: [dependents]
      operationId: addDependent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DependentInput' }
      responses:
        '201':
          description: Dependent created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dependent' }

  /patients/me/dependents/{dependentId}:
    patch:
      tags: [dependents]
      operationId: updateDependent
      parameters:
        - $ref: '#/components/parameters/DependentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DependentInput' }
      responses:
        '200':
          description: Dependent updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dependent' }

  /patients/me/dependents/{dependentId}/handover-invite:
    post:
      tags: [dependents]
      operationId: sendHandoverInvite
      parameters:
        - $ref: '#/components/parameters/DependentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HandoverInviteInput' }
      responses:
        '200':
          description: Invite sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dependent' }
        '409': { $ref: '#/components/responses/Conflict' }

  /patients/me/dependents/{dependentId}/handover-invite/resend:
    post:
      tags: [dependents]
      operationId: resendHandoverInvite
      parameters:
        - $ref: '#/components/parameters/DependentId'
      responses:
        '200':
          description: Invite re-sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dependent' }

  /patients/{patientProfileId}/health/{section}:
    get:
      tags: [health]
      operationId: listHealthEntries
      parameters:
        - $ref: '#/components/parameters/PatientProfileId'
        - $ref: '#/components/parameters/HealthSection'
      responses:
        '200':
          description: Entries for one health section
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HealthEntry' }

  /patients/{patientProfileId}/health:
    post:
      tags: [health]
      operationId: addHealthEntry
      parameters:
        - $ref: '#/components/parameters/PatientProfileId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HealthEntryInput' }
      responses:
        '201':
          description: Entry created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthEntry' }

  /patients/{patientProfileId}/health/{entryId}:
    patch:
      tags: [health]
      operationId: updateHealthEntry
      parameters:
        - $ref: '#/components/parameters/PatientProfileId'
        - $ref: '#/components/parameters/EntryId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HealthEntryUpdate' }
      responses:
        '200':
          description: Entry updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthEntry' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [health]
      operationId: removeHealthEntry
      parameters:
        - $ref: '#/components/parameters/PatientProfileId'
        - $ref: '#/components/parameters/EntryId'
      responses:
        '204': { description: Entry removed }

  /patients/{patientProfileId}/care-threads:
    get:
      tags: [care-threads]
      operationId: listCareThreads
      parameters:
        - $ref: '#/components/parameters/PatientProfileId'
      responses:
        '200':
          description: Care threads for a patient
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CareThread' }

  /care-threads/{threadId}:
    get:
      tags: [care-threads]
      operationId: getCareThread
      parameters:
        - $ref: '#/components/parameters/ThreadId'
      responses:
        '200':
          description: One care thread
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CareThread' }
        '404': { $ref: '#/components/responses/NotFound' }

  /facilities:
    get:
      tags: [facilities]
      operationId: listFacilities
      security: []
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [lab, pharmacy] }
        - name: lat
          in: query
          schema: { type: number }
        - name: lng
          in: query
          schema: { type: number }
        - name: query
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Facilities, distance-sorted when lat/lng are given
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FacilityWithDistance' }

  /facilities/{facilityId}/members:
    get:
      tags: [facility-team]
      operationId: listFacilityMembers
      parameters:
        - $ref: '#/components/parameters/FacilityId'
      responses:
        '200':
          description: Facility members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FacilityMember' }

  /facilities/{facilityId}/members/{memberId}:
    delete:
      tags: [facility-team]
      operationId: removeFacilityMember
      parameters:
        - $ref: '#/components/parameters/FacilityId'
        - $ref: '#/components/parameters/MemberId'
      responses:
        '200':
          description: Member removed, sessions revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemoveMemberResponse' }
        '409': { $ref: '#/components/responses/Conflict' }

  /facilities/{facilityId}/invites:
    get:
      tags: [facility-team]
      operationId: listFacilityInvites
      parameters:
        - $ref: '#/components/parameters/FacilityId'
      responses:
        '200':
          description: Pending invites (owner only)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FacilityInvite' }
    post:
      tags: [facility-team]
      operationId: inviteFacilityMember
      parameters:
        - $ref: '#/components/parameters/FacilityId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteMemberInput' }
      responses:
        '201':
          description: Invite created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FacilityInvite' }

  /facilities/{facilityId}/invites/{inviteId}:
    delete:
      tags: [facility-team]
      operationId: revokeFacilityInvite
      parameters:
        - $ref: '#/components/parameters/FacilityId'
        - $ref: '#/components/parameters/InviteId'
      responses:
        '200':
          description: Invite revoked
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean }

  /facilities/{facilityId}/invites/{inviteId}/resend:
    post:
      tags: [facility-team]
      operationId: resendFacilityInvite
      parameters:
        - $ref: '#/components/parameters/FacilityId'
        - $ref: '#/components/parameters/InviteId'
      responses:
        '200':
          description: Invite re-sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FacilityInvite' }

  /facilities/{facilityId}/fulfillment-queue:
    get:
      tags: [facility-team]
      operationId: getFulfillmentQueue
      parameters:
        - $ref: '#/components/parameters/FacilityId'
      responses:
        '200':
          description: Fulfillment queue with action attribution
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FulfillmentQueueItem' }

  /facilities/{facilityId}/fulfillment-queue/{itemId}/action:
    post:
      tags: [facility-team]
      operationId: updateFulfillmentItem
      parameters:
        - $ref: '#/components/parameters/FacilityId'
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FulfillmentActionInput' }
      responses:
        '200':
          description: Queue item updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FulfillmentQueueItem' }

  /doctor/appointments/today:
    get:
      tags: [queue]
      operationId: listTodayAppointments
      responses:
        '200':
          description: Today's appointments for the signed-in doctor
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Appointment' }

  /doctor/queue/today:
    get:
      tags: [queue]
      operationId: listQueue
      responses:
        '200':
          description: Checked-in patients in queue order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/QueueEntry' }

  /appointments/{appointmentId}/start:
    post:
      tags: [queue]
      operationId: startVisit
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        '200':
          description: Visit started (idempotent)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '409': { $ref: '#/components/responses/Conflict' }

  /appointments/{appointmentId}/complete:
    post:
      tags: [queue]
      operationId: completeVisit
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        '200':
          description: Visit completed (idempotent)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '409': { $ref: '#/components/responses/Conflict' }

  /doctor/queue/running-delay:
    get:
      tags: [queue]
      operationId: getRunningDelay
      responses:
        '200':
          description: Current running delay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunningDelay' }
    patch:
      tags: [queue]
      operationId: updateRunningDelay
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRunningDelayInput' }
      responses:
        '200':
          description: Running delay updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunningDelay' }

  /doctor/messages/threads:
    get:
      tags: [messaging]
      operationId: listMessageThreads
      parameters:
        - name: filter
          in: query
          schema: { type: string, enum: [all, unread, closing_soon] }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: Paginated threads, oldest unanswered first by default
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListThreadsResult' }

  /message-threads/{threadId}/read:
    post:
      tags: [messaging]
      operationId: markMessageThreadRead
      parameters:
        - $ref: '#/components/parameters/ThreadId'
      responses:
        '204': { description: Thread marked read }

  /consultation-notes/{appointmentId}:
    get:
      tags: [consultation]
      operationId: getConsultationNote
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        '200':
          description: Consultation note for an appointment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsultationNote' }
        '404': { $ref: '#/components/responses/NotFound' }

  /consultation-notes/{noteId}/sign-off:
    post:
      tags: [consultation]
      operationId: signOffConsultationNote
      parameters:
        - $ref: '#/components/parameters/NoteId'
      responses:
        '200':
          description: Note signed off and made immutable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsultationNote' }
        '409': { $ref: '#/components/responses/Conflict' }

  /consultation-notes/{noteId}/addenda:
    post:
      tags: [consultation]
      operationId: addConsultationAddendum
      parameters:
        - $ref: '#/components/parameters/NoteId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddAddendumInput' }
      responses:
        '201':
          description: Append-only addendum created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsultationAddendum' }

  /doctor/insights:
    get:
      tags: [insights]
      operationId: getDoctorPracticeInsights
      parameters:
        - name: preset
          in: query
          schema: { type: string, enum: [7d, 30d, 90d, custom] }
        - name: startDate
          in: query
          schema: { type: string }
        - name: endDate
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Authenticated doctor's own practice insights
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DoctorPracticeInsights' }

  /payments/wallet-link:
    get:
      tags: [payments]
      operationId: getOwnWalletLink
      responses:
        '200':
          description: Wallet link for the signed-in facility
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletLink' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [payments]
      operationId: linkWallet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkWalletInput' }
      responses:
        '200':
          description: Wallet linked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletLink' }

  /payments/intents:
    post:
      tags: [payments]
      operationId: createPaymentIntent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePaymentIntentInput' }
      responses:
        '201':
          description: Payment intent created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }

  /payments/intents/{id}:
    get:
      tags: [payments]
      operationId: getPaymentIntent
      parameters:
        - $ref: '#/components/parameters/PaymentIntentId'
      responses:
        '200':
          description: Payment intent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '404': { $ref: '#/components/responses/NotFound' }

  /payments/intents/{id}/fund:
    post:
      tags: [payments]
      operationId: fundPaymentIntent
      parameters:
        - $ref: '#/components/parameters/PaymentIntentId'
      responses:
        '200':
          description: Intent funded into escrow
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '409': { $ref: '#/components/responses/Conflict' }

  /payments/intents/{id}/release:
    post:
      tags: [payments]
      operationId: releasePaymentIntent
      parameters:
        - $ref: '#/components/parameters/PaymentIntentId'
      responses:
        '200':
          description: Escrow released to the facility
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '409': { $ref: '#/components/responses/Conflict' }

  /payments/intents/{id}/refund:
    post:
      tags: [payments]
      operationId: refundPaymentIntent
      parameters:
        - $ref: '#/components/parameters/PaymentIntentId'
      responses:
        '200':
          description: Escrow refunded to the patient
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PatientProfileId:
      name: patientProfileId
      in: path
      required: true
      schema: { type: string }
    DependentId:
      name: dependentId
      in: path
      required: true
      schema: { type: string }
    EntryId:
      name: entryId
      in: path
      required: true
      schema: { type: string }
    ThreadId:
      name: threadId
      in: path
      required: true
      schema: { type: string }
    FacilityId:
      name: facilityId
      in: path
      required: true
      schema: { type: string }
    MemberId:
      name: memberId
      in: path
      required: true
      schema: { type: string }
    InviteId:
      name: inviteId
      in: path
      required: true
      schema: { type: string }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string }
    AppointmentId:
      name: appointmentId
      in: path
      required: true
      schema: { type: string }
    NoteId:
      name: noteId
      in: path
      required: true
      schema: { type: string }
    ExportId:
      name: exportId
      in: path
      required: true
      schema: { type: string }
    PaymentIntentId:
      name: id
      in: path
      required: true
      schema: { type: string }
    HealthSection:
      name: section
      in: path
      required: true
      schema: { $ref: '#/components/schemas/HealthSectionKey' }

  responses:
    BadRequest:
      description: Invalid input (machine-readable error code included)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Missing or expired credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: Request conflicts with current state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Gone:
      description: Resource is no longer available (e.g. expired invite)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:
    ErrorEnvelope:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Human-readable summary. Never rendered verbatim by the UI — see error-catalogue.ts.
        code:
          type: string
          description: Machine-readable error code from docforum-core's catalogue.
          example: SLOT_TAKEN
        details:
          type: object
          additionalProperties: true
        requestId:
          type: string
          description: Support reference for unknown/unexpected errors.

    Role:
      type: string
      enum: [patient, doctor, facility, admin]
    SelfServeRole:
      type: string
      enum: [patient, doctor]
    VerificationStatus:
      type: string
      enum: [pending, verified, rejected]

    User:
      type: object
      required: [id, email, role, createdAt, updatedAt]
      properties:
        id: { type: string }
        email: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AuthSession:
      type: object
      required: [user, accessToken]
      properties:
        user: { $ref: '#/components/schemas/User' }
        accessToken: { type: string }

    SignupInput:
      type: object
      required: [role, email, password, fullName]
      properties:
        role: { $ref: '#/components/schemas/SelfServeRole' }
        email: { type: string }
        password: { type: string }
        fullName: { type: string }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    ClaimAccountInput:
      type: object
      required: [token, email, password]
      properties:
        token: { type: string }
        email: { type: string }
