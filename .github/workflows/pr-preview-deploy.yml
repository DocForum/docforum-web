# PR preview deployments (#104) — step 2 of 2: publish + comment.
#
# Triggered by `workflow_run` after the unprivileged build finishes. This job
# has write permissions, but it NEVER checks out or executes the pull request:
# it downloads the artifact the read-only build produced and copies those bytes
# into a subdirectory of the `gh-pages` branch. Fork PRs therefore cannot reach
# this job's token, and the artifact cannot contain secrets because the build
# had none.
#
# Previews live next to the main site rather than replacing it:
#   https://<owner>.github.io/<repo>/            ← main (deploy-pages.yml)
#   https://<owner>.github.io/<repo>/pr-preview/pr-<n>/
#
# Both this workflow and deploy-pages.yml push to `gh-pages`, so they share one
# concurrency group — a main deploy can never drop a preview and vice versa.
name: PR preview deploy

on:
  workflow_run:
    workflows: ['PR preview build']
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish preview
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve pull request
        id: pr
        run: |
          set -euo pipefail
          number=$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")
          if [ -z "$number" ]; then
            echo "::warning::No pull request associated with this build; nothing to deploy."
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Download the built preview
        if: steps.pr.outputs.number != ''
        uses: actions/download-artifact@v4
        with:
          name: pr-preview-${{ steps.pr.outputs.number }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: preview-dist

      - uses: actions/checkout@v4
        if: steps.pr.outputs.number != ''
        with:
          # Default branch; the gh-pages branch is fetched below.
          persist-credentials: true

      - name: Publish preview under pr-preview/pr-<n>
        if: steps.pr.outputs.number != ''
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git checkout -B gh-pages FETCH_HEAD
          else
            # First preview ever: start the branch without carrying main's tree.
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null
          fi

          rm -rf "pr-preview/pr-$PR"
          mkdir -p "pr-preview/pr-$PR"
          cp -R preview-dist/. "pr-preview/pr-$PR/"
          touch .nojekyll

          git add -A
          if git diff --cached --quiet; then
            echo "Preview content unchanged — nothing to commit."
          else
            git commit -m "chore(preview): PR #$PR at ${GITHUB_SHA:0:7}"
            git push origin gh-pages
          fi

      - name: Comment the preview URL on the PR
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          marker='<!-- docforum-pr-preview -->'
          url="https://${OWNER,,}.github.io/${REPO_NAME}/pr-preview/pr-${PR}/"
          short_sha="${HEAD_SHA:0:7}"

          body=$(cat <<EOF
          $marker
          ### 🔎 Preview deployment

          **${url}**

          - Built from \`${short_sha}\` ([build log](${RUN_URL}))
          - Runs against the **mock API** only — obviously fake seed data, no real backend, no real credentials.
          - Updated automatically on every push to this PR; removed when the PR closes.

          If the link 404s, the repository's Pages source must be the \`gh-pages\` branch — see \`CONTRIBUTING.md\` → "Preview deployments".
          EOF
          )

          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -n 1)

          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="$body" >/dev/null
            echo "Updated preview comment $existing"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$body" >/dev/null
            echo "Created preview comment"
          fi
