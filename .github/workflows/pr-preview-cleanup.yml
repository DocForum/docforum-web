# PR preview deployments (#104) — cleanup.
#
# A preview is removed once its PR is no longer open. This deliberately uses a
# scheduled sweep instead of a PR-close trigger, because a PR-close trigger
# that hands a fork PR a write token is flagged as high severity by automated
# malware scanners regardless of how carefully the job is written. A scheduled
# sweep avoids that entirely:
#
#   - It runs from the DEFAULT branch on a timer (`schedule`) — never from a
#     fork PR — so no untrusted code can influence it and no write token is
#     ever exposed to a PR.
#   - The only PR-derived value it touches is a number, read from the names of
#     directories already on `gh-pages` and used purely to decide what to
#     delete. It never checks out or executes PR code.
#
# Trade-off: cleanup is eventually consistent (within the cron interval)
# rather than instantaneous on close — an acceptable, safe trade for never
# running fork-controlled code with a write token.
name: PR preview cleanup

on:
  schedule:
    # Hourly, offset from the hour to avoid the top-of-the-hour stampede.
    - cron: '27 * * * *'
  workflow_dispatch: {} # manual trigger for maintainers

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  sweep:
    name: Remove previews for closed PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out gh-pages
        id: pages
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No gh-pages branch — nothing to clean up."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1
          git checkout -B gh-pages FETCH_HEAD
          echo "exists=true" >> "$GITHUB_OUTPUT"

      - name: Remove previews whose PR is closed
        if: steps.pages.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          marker='<!-- docforum-pr-preview -->'
          removed=()

          for dir in pr-preview/pr-*; do
            [ -d "$dir" ] || continue
            pr="${dir##*/pr-}"
            [[ "$pr" =~ ^[0-9]+$ ]] || continue
            # OPEN previews stay; CLOSED / MERGED / unknown (deleted head) go.
            state=$(gh pr view "$pr" --json state --jq .state 2>/dev/null || echo "UNKNOWN")
            if [ "$state" = "OPEN" ]; then
              continue
            fi
            echo "Removing preview for PR #$pr (state: $state)"
            rm -rf "$dir"
            removed+=("$pr")
          done

          rmdir pr-preview 2>/dev/null || true

          if [ ${#removed[@]} -eq 0 ]; then
            echo "No abandoned previews."
            exit 0
          fi

          git add -A
          git commit -m "chore(preview): remove previews for closed PRs (${removed[*]})"
          git push origin gh-pages

          # Best-effort: flip each removed PR's preview comment to "removed".
          body="${marker}
          ### 🔎 Preview deployment removed

          This pull request is closed, so its preview deployment has been deleted.
          Reopening the PR (or pushing to it) starts a fresh build and a new preview."
          for pr in "${removed[@]}"; do
            existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments" --paginate \
              --jq ".[] | select(.body | contains(\"${marker}\")) | .id" 2>/dev/null | head -n 1) || true
            if [ -n "$existing" ]; then
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
                -f body="$body" >/dev/null || true
            fi
          done
