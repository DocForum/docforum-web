# Deploys a UI preview of this repo's current main branch to GitHub Pages.
#
# This is a preview only — docforum-core has no implemented API yet, so
# anything here that calls the backend (login, signup) will fail against a
# real server. See README.md and ARCHITECTURE_ESSENTIALS.md "Known
# assumptions". This workflow is separate from ci.yml (still a Phase 1
# placeholder — see ROADMAP.md) because it has a different trigger (push to
# main, not pull_request) and a different purpose (deploy, not verify).
name: Deploy Pages preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
