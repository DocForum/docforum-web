# Deploys a UI preview of this repo's current main branch to GitHub Pages,
# pointed at docforum-core's Render preview deployment (see that repo's
# docs/adr/0003-render-preview-deployment.md). Still a preview, not
# production: free-tier backend (cold-starts after 15min idle, Postgres
# expires 2026-10-14 unless renewed) and free-tier disposable data — see
# README.md and ARCHITECTURE_ESSENTIALS.md. This workflow is separate from
# ci.yml (still a Phase 1 placeholder — see ROADMAP.md) because it has a
# different trigger (push to main, not pull_request) and a different
# purpose (deploy, not verify).
name: Deploy Pages preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  # GitHub advises against cancelling a Pages deployment while it is publishing.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:api-client
      - run: npm run check:i18n
      - run: npm run generate:api
      - name: Generated API client is up to date
        run: git diff --exit-code -- packages/api-client/src/generated
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build:pages
        env:
          VITE_API_BASE_URL: https://docforum-core-api.onrender.com
          # GitHub Pages has no server-side rewrites; keep HashRouter for this build.
          # BrowserRouter is the default for all other deployments.
          VITE_USE_HASH_ROUTER: "true"
      - run: npm run check:dist
      - run: npm run check:pages
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
