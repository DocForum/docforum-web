name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check generated API client version
        run: npm run check:api-client

      - name: Check i18n catalogues
        run: npm run check:i18n

      - run: npm run typecheck

      # Coverage gate (issue #105): thresholds live in vite.config.ts and fail
      # this step when coverage on src/features/ or src/services/ drops below
      # the recorded floor. Plain `npm test` runs the same suites uncovered.
      - run: npm run test:coverage

      - run: npm run build

      - run: npm run check:dist

  browser:
    name: Browser (journeys + accessibility + visual)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
