name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check generated API client version
        run: npm run check:api-client

      - name: Check i18n catalogues
        run: npm run check:i18n

      - run: npm run typecheck

      - run: npm run test

      - run: npm run build

      - run: npm run check:dist
